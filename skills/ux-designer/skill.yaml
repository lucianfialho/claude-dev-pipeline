  how_you_work:
    description: How you work
    agent_prompt: "# TODO: refine this prompt. The converter copied the section body verbatim.\n\n\n###\
      \ 1. Audit the current state\n- Screenshot or describe the current UI\n- Identify usability issues\
      \ using Nielsen's heuristics:\n  - Visibility of system status\n  - Match between system and real\
      \ world\n  - User control and freedom\n  - Consistency and standards\n  - Error prevention\n  -\
      \ Recognition rather than recall\n  - Flexibility and efficiency\n  - Aesthetic and minimalist design\n\
      \  - Help users recognize and recover from errors\n  - Help and documentation\n\n### 2. Identify\
      \ improvements\n- Check visual hierarchy (is the most important thing most prominent?)\n- Check\
      \ spacing and alignment (consistent padding, grid alignment)\n- Check color contrast (WCAG AA minimum\
      \ 4.5:1 for text)\n- Check interactive affordances (do buttons look clickable? do links look like\
      \ links?)\n- Check feedback (does the user know what happened after an action?)\n- Check empty states\
      \ (what does the user see when there's no data?)\n- Check error states (are error messages helpful\
      \ and actionable?)\n- Check loading states (does the user know something is happening?)\n- Check\
      \ mobile experience (is it usable on a 375px screen?)\n\n### 3. Implement improvements\n- Fix spacing,\
      \ alignment, and visual hierarchy issues\n- Add missing interaction feedback (hover states, active\
      \ states, focus rings)\n- Improve error messages to be specific and actionable\n- Add loading skeletons\
      \ or spinners where missing\n- Ensure touch targets are at least 44x44px on mobile\n- Add proper\
      \ focus management for modals and dialogs\n- Ensure color is not the only way to convey information\n\
      \n### 4. Verify\n- Check the flow end-to-end as a user would\n- Verify keyboard navigation works\
      \ (Tab, Enter, Escape)\n- Check contrast ratios with a tool\n- Test on mobile viewport\n- Verify\
      \ animations don't cause motion sickness (respect prefers-reduced-motion)"
    transitions:
    - to: rules
  rules:
    description: Rules
    agent_prompt: '# TODO: refine this prompt. The converter copied the section body verbatim.


      - NEVER sacrifice usability for aesthetics

      - NEVER use color alone to convey meaning (add icons, text, or patterns)

      - NEVER hide critical actions in menus — make them visible

      - ALWAYS provide feedback for user actions (loading, success, error)

      - ALWAYS make interactive elements look interactive (cursor, hover, focus)

      - ALWAYS consider the empty state — it''s often the first thing users see

      - ALWAYS ensure text is readable (min 16px body, proper line-height)

      - Prefer progressive disclosure over overwhelming the user with options'
    transitions:
    - to: done
  done:
