id: backend-dev
version: 1
description: >
  Backend specialist sub-skill. Implements API routes, database changes,
  auth, and server-side logic for a GitHub issue. Designed to be invoked
  as a sub-run by orchestrators like solve-issue via delegate_to, or
  directly by the agent when the task is clearly backend-only.

inputs:
  required:
    - name: issue_number
      type: integer

initial_state: understand

states:

  understand:
    description: Read the issue and produce a concrete implementation plan
    agent_prompt: |
      Read GitHub issue #{{inputs.issue_number}} via `gh issue view`.
      Produce a concrete implementation plan for the backend work.

      Before writing code, decide:
        - Which files / routes need to change (concrete paths)
        - What the new behavior is (one paragraph, no hand-waving)
        - Which tests prove the behavior is correct

      Do NOT skip this step by listing "all files that might be relevant."
      Be specific. If the issue is ambiguous, read its comments and pick
      the most plausible interpretation — document that pick in
      `new_behavior`.

      Emit YAML at {{output_path}}:
        plan:
          files_to_change: [<path>, ...]
          new_behavior: "<one paragraph>"
          tests_needed: [<test description>, ...]
    output_schema: skills/backend-dev/schemas/understand.output.schema.json
    transitions:
      - to: implement

  implement:
    description: Execute the plan, write the tests, verify they pass
    agent_prompt: |
      Execute the plan from the understand state:
        {{output.plan}}

      Rules:
        - Write code that matches the existing patterns in the repo.
        - Every new endpoint, handler, or service needs corresponding tests.
        - Run the tests before claiming success (`pnpm test` or project equivalent).
        - If tests fail, fix them. Do not mark tests_passed: true unless
          they actually pass.

      When the implementation is done and verified, emit YAML at
      {{output_path}} matching this shape:
        implementation:
          summary: "<one paragraph describing what was shipped>"
          files_touched: [<path>, ...]
          tests_run: "<how the tests were executed>"
          tests_passed: true | false
          notes: "<optional — caveats, follow-ups, things you skipped and why>"

      This shape is SHARED with frontend-dev so orchestrators can read
      `{{output.implementation.summary}}` uniformly regardless of which
      specialist ran. Keep it consistent.
    output_schema: skills/backend-dev/schemas/implement.output.schema.json
    transitions:
      - to: done

  done:
    terminal: true
    description: Backend implementation finished
