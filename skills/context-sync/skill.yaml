  process:
    description: Process
    agent_prompt: "# TODO: refine this prompt. The converter copied the section body verbatim.\n\n\n###\
      \ 1. Identify target directories\n\n**If diff mode:**\n```bash\n# Files changed in last commit +\
      \ any uncommitted changes\ngit diff --name-only HEAD~1 2>/dev/null\ngit status --porcelain | awk\
      \ '{print $2}'\n```\n\n**If full mode:**\n```bash\n# All source files — skip generated/config dirs\n\
      find . -type f \\( -name \"*.ts\" -o -name \"*.tsx\" -o -name \"*.js\" -o -name \"*.jsx\" -o -name\
      \ \"*.py\" \\) \\\n  | grep -vE \"node_modules|\\.git|\\.next|dist|build|\\.metadata|coverage\"\
      \ \\\n  | sed 's|/[^/]*$||' | sort -u\n```\n\nFor each changed file, extract its **parent directory**.\
      \ Deduplicate — one `.metadata/` per directory describes all files in that directory.\n\n**Skip**\
      \ these directories entirely:\n- `node_modules/`, `.git/`, `.next/`, `dist/`, `build/`, `coverage/`\n\
      - Directories containing only config files (`*.config.ts`, `*.config.js`)\n- Directories containing\
      \ only generated files (migrations auto-generated, prisma client, etc.)\n\n### 2. For each target\
      \ directory\n\n#### a. Read the files in the directory\nRead source files (skip test files and `.metadata/`).\
      \ Understand:\n- What this module/component does\n- What it depends on (imports)\n- What patterns\
      \ and conventions it uses\n- Its relationship to other parts of the codebase\n\nAlso check git log\
      \ to understand the origin:\n```bash\n# Most recent commits touching files in this directory\ngit\
      \ log --oneline -5 -- <directory>/\n```\n\n#### b. Check for existing metadata\n```bash\nls <directory>/.metadata/\
      \ 2>/dev/null\n```\n\n- If `.metadata/` exists and files are recent: read them, update only what\
      \ changed\n- If `.metadata/` is missing or empty: create fresh metadata\n\n#### c. Write `.metadata/context.md`\n\
      \n```markdown\n# <ModuleName> — Context\n\n**Type**: <React Component | API Route | Server Action\
      \ | Hook | Utility | Schema | Migration | Test suite | etc.>\n**Specialist**: <frontend-dev | backend-dev\
      \ | qa-engineer | ux-designer | none>\n**Last updated**: <YYYY-MM-DD>"
