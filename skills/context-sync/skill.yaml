      #### e. Write `.metadata/summary.md`


      **One line only** — this file is loaded by specialists before reading code. Optimize for speed:


      ```

      <ModuleName> (<type>, <specialist>, <date>) — <one-sentence description>. Deps: <dep1>, <dep2>.

      ```


      Examples:

      ```

      NavBar (component, frontend-dev, 2026-04-01) — Top navigation with auth-aware avatar and mobile
      hamburger menu. Deps: next-auth, tailwindcss, @/components/ui/Avatar.

      UsersRoute (api-route, backend-dev, 2026-03-28) — CRUD endpoints for user management with pagination
      and role-based auth. Deps: prisma, zod, next-auth.

      useCart (hook, frontend-dev, 2026-03-15) — Client-side cart state with optimistic updates and Zustand
      persistence. Deps: zustand, @/lib/api.

      ```


      ### 3. Update Component Registry in CLAUDE.md


