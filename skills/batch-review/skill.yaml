id: batch-review
version: 1
description: Run multiple specialist reviews on a PR in parallel using subagents
initial_state: usage
states:
  usage:
    description: Usage
    agent_prompt: '# TODO: refine this prompt. The converter copied the section body verbatim.



      ```

      /batch-review            — Full review of the current PR branch

      /batch-review 42         — Full review of PR #42

      ```'
    transitions:
    - to: prerequisites
  prerequisites:
    description: Prerequisites
    agent_prompt: '# TODO: refine this prompt. The converter copied the section body verbatim.



      Depends on these specialist skills being available:

      - `code-reviewer` — Code quality and security review

      - `frontend-dev` — Frontend/React specialist

      - `backend-dev` — Backend/API specialist

      - `ux-designer` — UX/accessibility review

      - `qa-engineer` — Test coverage and quality'
    transitions:
    - to: process
  process:
    description: Process
    agent_prompt: "# TODO: refine this prompt. The converter copied the section body verbatim.\n\n\n###\
      \ 1. Analyze the PR diff\n\n```bash\ngh pr view --json number,title,body,files\ngh pr diff\n```\n\
      \nCategorize changed files:\n- **Frontend**: `.tsx`, `.jsx`, `.css`, `.scss`, `.module.css`\n- **Backend**:\
      \ `route.ts`, `route.js`, `actions.ts`, files in `api/`\n- **Database**: `migration*`, `schema*`,\
      \ `*.prisma`, `*.sql`\n- **Tests**: `*.test.*`, `*.spec.*`, `__tests__/`\n- **Config**: `*.config.*`,\
      \ `*.json`, `*.yaml`, `.env*`\n\n### 2. Select applicable specialists\n\nBased on changed file categories:\n\
      \n| Files Changed | Specialists to Run |\n|--------------|-------------------|\n| Frontend files\
      \ | `frontend-dev`, `ux-designer` |\n| Backend files | `backend-dev` |\n| Any files | `code-reviewer`\
      \ (security focus) |\n| No test files for new code | `qa-engineer` (suggest tests) |\n\n**Always\
      \ run**: security review (code-reviewer)\n**Skip if no relevant files**: frontend-dev, ux-designer,\
      \ backend-dev\n\nMinimum: 1 specialist (security). Maximum: 4 specialists.\n\n### 3. Dispatch subagents\
      \ in parallel\n\nUse the Agent tool to run up to 3 specialists in parallel:\n\n```\nFor each selected\
      \ specialist:\n  Agent(\n    prompt: \"Review this PR diff as a <specialist>. Use the /<skill> format.\
      \ PR diff: <diff>\",\n    subagent_type: \"general-purpose\"\n  )\n```\n\n**Constraints**:\n- Max\
      \ 3 parallel agents (to avoid rate limits)\n- If 4+ specialists needed, run the 4th after the first\
      \ batch completes\n- Each agent gets the full PR diff but only reviews their domain\n\n### 4. Collect\
      \ and merge results\n\nWait for all agents to complete, then merge their outputs into a unified\
      \ review:\n\n```markdown"
    transitions:
    - to: comprehensive_review
  comprehensive_review:
    description: Comprehensive Review
    agent_prompt: '# TODO: refine this prompt. The converter copied the section body verbatim.



      **PR #<N>**: <title>

      **Specialists**: <list of specialists that ran>


      ---


      ### 🔒 Security Review

      <output from code-reviewer>


