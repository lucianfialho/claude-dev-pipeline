id: frontend-dev
version: 1
description: >
  Frontend specialist sub-skill. Implements React/Next.js component,
  page, and UI changes for a GitHub issue. Designed to be invoked as
  a sub-run by orchestrators like solve-issue via delegate_to, or
  directly by the agent when the task is clearly frontend-only.

inputs:
  required:
    - name: issue_number
      type: integer

initial_state: understand

states:

  understand:
    description: Read the issue and produce a concrete component-level plan
    agent_prompt: |
      Read GitHub issue #{{inputs.issue_number}} via `gh issue view`.
      Produce a concrete implementation plan for the frontend work.

      Before writing code, decide:
        - Which components/pages need to change (concrete paths)
        - What the new behavior is (one paragraph, no hand-waving)
        - Accessibility considerations (focus, keyboard, ARIA)
        - Which tests prove the behavior is correct

      Prefer Server Components unless the component needs interactive
      state. If using client components, mark them with `'use client'`
      at the file boundary, not sprinkled throughout.

      Emit YAML at {{output_path}}:
        plan:
          components_to_change: [<path>, ...]
          new_behavior: "<one paragraph>"
          accessibility_considerations: [<point>, ...]   # optional
          tests_needed: [<test description>, ...]
    output_schema: skills/frontend-dev/schemas/understand.output.schema.json
    transitions:
      - to: implement

  implement:
    description: Execute the plan, write the tests, verify they pass
    agent_prompt: |
      Execute the plan from the understand state:
        {{output.plan}}

      Rules:
        - Match the existing component patterns in the repo
        - Server Components by default, `'use client'` only where needed
        - Every new component with behavior needs a test
        - Respect the accessibility considerations from the plan
        - Run the tests (`pnpm test` or project equivalent) before claiming success
        - If tests fail, fix them. Do not mark tests_passed: true unless
          they actually pass.

      When done and verified, emit YAML at {{output_path}} matching this shape:
        implementation:
          summary: "<one paragraph describing what was shipped>"
          files_touched: [<path>, ...]
          tests_run: "<how the tests were executed>"
          tests_passed: true | false
          notes: "<optional — caveats, follow-ups, skipped items with reason>"

      This shape is SHARED with backend-dev so orchestrators can read
      `{{output.implementation.summary}}` uniformly regardless of which
      specialist ran. Keep it consistent.
    output_schema: skills/frontend-dev/schemas/implement.output.schema.json
    transitions:
      - to: done

  done:
    terminal: true
    description: Frontend implementation finished
