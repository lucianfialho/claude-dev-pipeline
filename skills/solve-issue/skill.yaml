id: solve-issue
version: 1
description: >
  Autonomous orchestrator. Reads a GitHub issue, classifies which
  specialist should implement it, delegates to backend-dev or
  frontend-dev as a sub-run, reviews the implementation, and produces
  a final verdict. Each delegated specialist is itself a state
  machine with its own schema validation and audit trail — this is a
  real sub-pipeline, not flattened prose.

inputs:
  required:
    - name: issue_number
      type: integer

initial_state: fetch_issue

states:

  fetch_issue:
    description: Pull the issue body, labels, and comments from GitHub
    agent_prompt: |
      Use `gh issue view {{inputs.issue_number}} --json number,title,body,labels,comments`
      to fetch the issue. Comments come as a structured array — extract
      just the body text of each one into a flat list of strings.

      Emit YAML at {{output_path}}:
        issue:
          number: integer
          title: string
          body: string
          labels: [string]
          comments: [string]
    output_schema: skills/solve-issue/schemas/fetch_issue.output.schema.json
    transitions:
      - to: classify

  classify:
    description: Decide which specialist sub-skill should implement this
    agent_prompt: |
      Read the issue you just fetched:
        {{output.issue}}

      Decide which specialist should implement it. Choose EXACTLY ONE:

        - "backend"  — API routes, database queries, auth, server logic,
                       background jobs, anything in app/api/, lib/server/,
                       or prisma/
        - "frontend" — React/Next.js components, pages, UI interactions,
                       styling, a11y, anything in components/, app/ pages
                       (that are not route handlers), or public/

      If the issue genuinely spans both (e.g. "add a logout button that
      calls /api/logout"), pick the side where the harder work is. In
      doubt, pick backend — the frontend surface is usually smaller.

      Emit YAML at {{output_path}}:
        specialist: "backend" | "frontend"
        reasoning: "<one sentence explaining the choice>"
    output_schema: skills/solve-issue/schemas/classify.output.schema.json
    transitions:
      - to: delegate_backend
        when: "output.specialist == 'backend'"
      - to: delegate_frontend
        when: "output.specialist == 'frontend'"

  delegate_backend:
    description: Delegate implementation to the backend-dev sub-skill
    delegate_to: claude-dev-pipeline:backend-dev
    delegate_inputs:
      issue_number: "{{inputs.issue_number}}"
    transitions:
      - to: review

  delegate_frontend:
    description: Delegate implementation to the frontend-dev sub-skill
    delegate_to: claude-dev-pipeline:frontend-dev
    delegate_inputs:
      issue_number: "{{inputs.issue_number}}"
    transitions:
      - to: review

  review:
    description: Review the specialist's implementation for correctness
    agent_prompt: |
      The specialist sub-skill finished and returned:
        summary:       {{output.implementation.summary}}
        files_touched: {{output.implementation.files_touched}}
        tests_passed:  {{output.implementation.tests_passed}}

      Review the implementation. Check:
        - Does the summary actually address the issue {{inputs.issue_number}}?
        - Do the files touched match what the issue asked for?
        - Did the tests pass? (If tests_passed is false, that's a
          REQUEST_CHANGES, no exceptions.)
        - Any obvious red flags — secrets committed, unsafe SQL, missing
          auth checks, accessibility regressions?

      Be honest. If the specialist skipped something important with a
      vague `notes` entry, flag it.

      Emit YAML at {{output_path}}:
        verdict: APPROVE | REQUEST_CHANGES
        summary: "<one sentence, tied to the findings>"
        blocking_issues: [<string>, ...]   # optional, list only if REQUEST_CHANGES
    output_schema: skills/solve-issue/schemas/review.output.schema.json
    transitions:
      - to: done

  done:
    terminal: true
    description: solve-issue orchestration finished — see review output for verdict
